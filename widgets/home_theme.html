<style>
/* ====== SNULA HOME · dark / light band rhythm ====== */
.elementor-4551{--sn-dark:#1e1b17;--sn-hero:#141210;--sn-light:#edeae3;--sn-light2:#e2ded3;
 --sn-ink:#1f1b16;--sn-ink-mid:#35302a;--sn-ink-dim:#6d675e;--sn-line-l:#d5d0c5;--sn-acc-l:#8a5a1e}

/* --- dark bands --- */
.elementor-4551 .elementor-element-63134c4d{background-color:var(--sn-hero)}
.elementor-4551 .elementor-element-b5b30e8,
.elementor-4551 .elementor-element-9542f2e{background-color:var(--sn-dark)}
.elementor-4551 .elementor-element-b5b30e8{padding:86px 0 94px!important}

/* --- light bands --- */
.elementor-4551 .elementor-element-46fff43,
.elementor-4551 .elementor-element-749e7bf{background-color:var(--sn-light);color:var(--sn-ink)}
.elementor-4551 .elementor-element-46fff43{padding:84px 0 90px!important}
.elementor-4551 .elementor-element-749e7bf{padding:84px 0 96px!important}

/* News on light */
.elementor-4551 .elementor-element-46fff43 .nw-h{color:var(--sn-ink)}
.elementor-4551 .elementor-element-46fff43 .nw-more{color:var(--sn-ink-dim);border-bottom-color:rgba(31,27,22,.3)}
.elementor-4551 .elementor-element-46fff43 .nw-more:hover{color:var(--sn-ink)}
.elementor-4551 .elementor-element-46fff43 .gallery-latest .list a{background-color:var(--sn-light2)!important}
.elementor-4551 .elementor-element-46fff43 .gallery-latest .inner{scrollbar-color:#b8b2a5 var(--sn-light2)}
.elementor-4551 .elementor-element-46fff43 .gallery-latest .inner::-webkit-scrollbar-track{background:var(--sn-light2)}
.elementor-4551 .elementor-element-46fff43 .gallery-latest .inner::-webkit-scrollbar-thumb{background:#b8b2a5}

/* Mo'em / 연구 성과 on light */
.elementor-4551 .elementor-element-749e7bf .tab-b{color:#9c968b}
.elementor-4551 .elementor-element-749e7bf .tab-b:hover{color:var(--sn-ink-mid)}
.elementor-4551 .elementor-element-749e7bf #snutab1:checked ~ .tab-top label[for="snutab1"],
.elementor-4551 .elementor-element-749e7bf #snutab2:checked ~ .tab-top label[for="snutab2"]{color:var(--sn-ink)}
.elementor-4551 .elementor-element-749e7bf .tab-more{color:var(--sn-ink-dim);border-bottom-color:rgba(31,27,22,.3)}
.elementor-4551 .elementor-element-749e7bf .tab-more:hover{color:var(--sn-ink)}
.elementor-4551 .elementor-element-749e7bf .ph-rows{border-top-color:var(--sn-line-l)}
/* Mo'em 캡슐 */
.elementor-4551 .elementor-element-749e7bf .mo-cap{border-color:rgba(31,27,22,.17);background:rgba(31,27,22,.035)}
.elementor-4551 .elementor-element-749e7bf .mo-cap:hover{border-color:rgba(31,27,22,.42);background:rgba(31,27,22,.07)}
.elementor-4551 .elementor-element-749e7bf .mo-cap b{color:var(--sn-ink)}
.elementor-4551 .elementor-element-749e7bf .mo-cap span{color:var(--sn-ink-dim)}
/* 연구 성과 목록 */
.elementor-4551 .elementor-element-749e7bf .rs-list li{border-bottom-color:rgba(31,27,22,.11)}
.elementor-4551 .elementor-element-749e7bf .rs-list a{color:var(--sn-ink-mid)}
.elementor-4551 .elementor-element-749e7bf .rs-list a:hover{color:var(--sn-acc-l)}
.elementor-4551 .elementor-element-749e7bf .rs-list{scrollbar-width:thin;scrollbar-color:#b8b2a5 transparent}
.elementor-4551 .elementor-element-749e7bf .rs-list::-webkit-scrollbar{width:8px}
.elementor-4551 .elementor-element-749e7bf .rs-list::-webkit-scrollbar-track{background:var(--sn-light2)}
.elementor-4551 .elementor-element-749e7bf .rs-list::-webkit-scrollbar-thumb{background:#b8b2a5}
/* 게시판 목록형(추후 실데이터) */
.elementor-4551 .elementor-element-749e7bf .tabsec .default-latest ul{border-top-color:var(--sn-line-l)}
.elementor-4551 .elementor-element-749e7bf .tabsec .default-latest li{border-bottom-color:var(--sn-line-l)!important}
.elementor-4551 .elementor-element-749e7bf .tabsec .default-latest li:hover{background-color:rgba(31,27,22,.055)!important}
.elementor-4551 .elementor-element-749e7bf .tabsec .default-latest .subject a{color:var(--sn-ink)!important}
.elementor-4551 .elementor-element-749e7bf .tabsec .default-latest .date{color:var(--sn-ink-dim)!important}

/* 히어로 슬라이드 오버레이 - 남색 그라데이션 제거, 레퍼런스처럼 검정 스크림 */
.elementor-4551 .elementor-element.elementor-element-6c9c2764 .jet-slider .sp-image-container::after,
.elementor-4551 .jet-slider__item.elementor-repeater-item-698e125 .sp-image-container::after,
.elementor-4551 .jet-slider__item .sp-image-container::after{
 background-color:transparent!important;
 background-image:linear-gradient(100deg,rgba(10,9,8,.78) 0%,rgba(10,9,8,.5) 40%,rgba(10,9,8,.22) 72%,rgba(10,9,8,.08) 100%)!important;
 opacity:1!important}

/* 히어로 타이틀 - 레퍼런스(Helvetica 계열 · 400 · 약 96px) */
.elementor-4551 .jet-slider__title,
.elementor-4551 .jet-slider__title strong{font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans KR",sans-serif!important;
 font-weight:400!important;font-size:96px!important;line-height:1.06!important;letter-spacing:-.02em!important}
@media (max-width:1300px){.elementor-4551 .jet-slider__title,.elementor-4551 .jet-slider__title strong{font-size:7.2vw!important}}
@media (max-width:640px){.elementor-4551 .jet-slider__title,.elementor-4551 .jet-slider__title strong{font-size:40px!important}}

/* ====== rise-in on scroll ====== */
.elementor-4551 .sn-rise{opacity:0;transform:translateY(28px);
 transition:opacity .9s cubic-bezier(.22,.72,.24,1) var(--sn-d,0ms),
            transform .9s cubic-bezier(.22,.72,.24,1) var(--sn-d,0ms)}
.elementor-4551 .sn-rise.sn-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
 .elementor-4551 .sn-rise{opacity:1!important;transform:none!important;transition:none}}
</style>

<script>
(function(){
 function boot(){
  var root=document.querySelector('.elementor-4551'); if(!root||root.__snBand) return;
  root.__snBand=1;
  function mark(el,d){ if(!el||el.classList.contains('sn-rise')) return false;
   el.classList.add('sn-rise'); if(d) el.style.setProperty('--sn-d',d+'ms'); return true; }

  /* 1) 개별 관찰 — 항상 화면에 있는 요소들 */
  var solo=[];
  [['.elementor-element-46fff43 .nw-top',0,0],
   ['.elementor-element-46fff43 .gallery-latest .list',90,70],
   ['.elementor-element-b5b30e8 .bl-top',0,0],
   ['.elementor-element-b5b30e8 .bl-stage',130,0]
  ].forEach(function(g){
   [].forEach.call(root.querySelectorAll(g[0]),function(el,i){
    if(mark(el,g[1]+i*g[2])) solo.push(el); });
  });

  /* 2) 묶음 관찰 — 탭 안쪽은 숨겨진 패널이 있어 한 번에 띄운다 */
  var sec=root.querySelector('.elementor-element-749e7bf .tabsec');
  var batch=[];
  if(sec){
   mark(sec.querySelector('.tab-top'),0);
   batch.push(sec.querySelector('.tab-top'));
   [].forEach.call(sec.querySelectorAll('.mo-cap'),function(el,i){ mark(el,90+i*45); batch.push(el); });
   [].forEach.call(sec.querySelectorAll('.rs-list li'),function(el,i){ mark(el,90+i*32); batch.push(el); });
   batch=batch.filter(Boolean);
  }

  function showAll(list){ list.forEach(function(e){ e.classList.add('sn-in'); }); }
  if(!('IntersectionObserver' in window)){ showAll(solo); showAll(batch); return; }

  var io=new IntersectionObserver(function(es){
   es.forEach(function(e){ e.target.classList.toggle('sn-in', e.isIntersecting); });
  },{threshold:.12, rootMargin:'0px 0px -8% 0px'});
  solo.forEach(function(e){ io.observe(e); });

  if(sec && batch.length){
   var io2=new IntersectionObserver(function(es){
    es.forEach(function(e){ var on=e.isIntersecting;
     batch.forEach(function(el){ el.classList.toggle('sn-in', on); }); });
   },{threshold:.06, rootMargin:'0px 0px -6% 0px'});
   io2.observe(sec);
  }
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
 else boot();
 window.addEventListener('load',boot);
})();
</script>
